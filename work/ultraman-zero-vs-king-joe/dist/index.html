<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050a13">
  <meta name="description" content="赛罗奥特曼与金古桥的原创 SVG 二维循环战斗动画。">
  <title>赛罗 VS 金古桥 · 矢量战斗动画</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23050a13' d='M0 0h64v64H0z'/%3E%3Cpath fill='%23eaf8ff' d='M32 8 17 19l5 28 10 9 10-9 5-28z'/%3E%3Cpath fill='%2300d8ff' d='m24 25 7 4-7 5-5-4zm16 0-7 4 7 5 5-4z'/%3E%3Cpath fill='%23ef334e' d='m32 8-6 16 6 5 6-5z'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --ink: #05070c;
      --panel: rgba(8, 16, 28, 0.82);
      --line: rgba(149, 217, 255, 0.22);
      --text: #eef9ff;
      --muted: #8ca5b8;
      --cyan: #29e7ff;
      --blue: #2979ff;
      --red: #ff385c;
      --gold: #ffc83d;
      --duration: 14s;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 20%, rgba(23, 57, 91, .35), transparent 33%),
        linear-gradient(180deg, #060b14 0%, #020409 100%);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }

    button { font: inherit; }

    .page {
      width: min(1500px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(14px, 2.4vw, 34px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }

    .masthead,
    .control-deck {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }

    .brand-mark {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(41, 231, 255, .38);
      clip-path: polygon(50% 0, 100% 25%, 87% 100%, 13% 100%, 0 25%);
      background: linear-gradient(145deg, rgba(41, 231, 255, .18), rgba(255, 56, 92, .08));
      box-shadow: 0 0 22px rgba(41, 231, 255, .12);
    }

    .brand-mark svg { width: 21px; height: 21px; }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--cyan);
      font: 700 12px/1.1 ui-monospace, "Cascadia Mono", monospace;
      letter-spacing: .2em;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.1vw, 32px);
      line-height: 1;
      letter-spacing: .05em;
      white-space: nowrap;
    }

    h1 span { color: #74899c; font-weight: 400; margin: 0 .2em; }

    .live-tag {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #b8c9d5;
      font: 700 12px/1 ui-monospace, "Cascadia Mono", monospace;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(255, 56, 92, .12), 0 0 16px var(--red);
      animation: livePulse 1.2s ease-in-out infinite;
    }

    .theater {
      position: relative;
      align-self: center;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 160px);
      overflow: hidden;
      isolation: isolate;
      border: 1px solid rgba(141, 214, 255, .3);
      border-radius: 4px;
      background: #070b12;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, .55),
        inset 0 0 0 1px rgba(255,255,255,.035),
        inset 0 0 80px rgba(0,0,0,.35);
    }

    .theater::before,
    .theater::after {
      content: "";
      position: absolute;
      z-index: 20;
      pointer-events: none;
      inset: 0;
    }

    .theater::before {
      background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(255,255,255,.025) 4px);
      mix-blend-mode: soft-light;
    }

    .theater::after {
      box-shadow: inset 0 0 100px 25px rgba(0,0,0,.62);
    }

    .battlefield {
      display: block;
      width: 100%;
      height: 100%;
      animation: sceneShake var(--duration) linear infinite;
    }

    .battlefield.paused,
    .battlefield.paused *,
    .battlefield.paused *::before,
    .battlefield.paused *::after {
      animation-play-state: paused !important;
    }

    .hud {
      position: absolute;
      z-index: 12;
      top: clamp(10px, 2vw, 26px);
      left: clamp(10px, 2vw, 26px);
      right: clamp(10px, 2vw, 26px);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: clamp(10px, 3vw, 44px);
      pointer-events: none;
    }

    .fighter-card { min-width: 0; }
    .fighter-card.right { text-align: right; }

    .fighter-name {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      color: #dff7ff;
      font: 800 clamp(11px, 1.2vw, 17px)/1 ui-monospace, "Cascadia Mono", monospace;
      letter-spacing: .12em;
      text-shadow: 0 2px 12px #000;
    }

    .fighter-card.right .fighter-name { flex-direction: row-reverse; }
    .fighter-id { color: #7b94a7; font-size: .7em; }

    .energy-bar {
      height: clamp(4px, .55vw, 8px);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(0,0,0,.52);
      transform: skewX(-18deg);
    }

    .energy-bar::before {
      content: "";
      display: block;
      height: 100%;
      width: 100%;
      transform-origin: left;
      background: linear-gradient(90deg, var(--blue), var(--cyan), #e6fcff);
      box-shadow: 0 0 15px var(--cyan);
      animation: zeroHealth var(--duration) linear infinite;
    }

    .fighter-card.right .energy-bar::before {
      transform-origin: right;
      background: linear-gradient(90deg, #fff4a3, var(--gold), #ff7538);
      animation-name: kingHealth;
    }

    .roundel {
      width: clamp(42px, 5vw, 70px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid rgba(205, 239, 255, .5);
      border-radius: 50%;
      background: rgba(3, 9, 16, .75);
      box-shadow: 0 0 0 4px rgba(5, 15, 27, .6), 0 0 26px rgba(41, 231, 255, .12);
      color: white;
      font: 900 clamp(14px, 1.7vw, 24px)/1 ui-monospace, monospace;
      letter-spacing: -.12em;
    }

    .roundel small {
      display: block;
      margin-top: 2px;
      color: var(--red);
      font-size: .35em;
      letter-spacing: .16em;
      text-align: center;
    }

    .intro-card {
      position: absolute;
      z-index: 11;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      pointer-events: none;
      background: radial-gradient(circle, rgba(10,23,37,.72), rgba(0,0,0,.08) 52%, transparent 70%);
      animation: introCard var(--duration) linear infinite;
    }

    .intro-card p { margin: 0; }

    .intro-kicker {
      color: var(--cyan);
      font: 700 clamp(10px, 1vw, 14px)/1 ui-monospace, monospace;
      letter-spacing: .5em;
      text-shadow: 0 0 18px var(--cyan);
    }

    .intro-title {
      margin: .28em 0 .15em !important;
      font-size: clamp(34px, 7.6vw, 104px);
      font-weight: 950;
      line-height: .9;
      letter-spacing: -.06em;
      text-shadow: 0 5px 0 rgba(0,0,0,.45), 0 0 35px rgba(255,255,255,.18);
    }

    .intro-title i { color: var(--red); font-style: normal; font-size: .54em; vertical-align: 20%; margin: 0 .15em; }

    .intro-sub {
      color: #a2b9c9;
      font: 700 clamp(10px, 1vw, 14px)/1 ui-monospace, monospace;
      letter-spacing: .2em;
    }

    .caption {
      position: absolute;
      z-index: 13;
      left: 50%;
      bottom: clamp(14px, 2.5vw, 34px);
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 36px);
      padding: 8px 14px 7px;
      border-left: 2px solid var(--cyan);
      border-right: 2px solid var(--cyan);
      background: rgba(2, 7, 13, .78);
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
      color: #f4fbff;
      font: 800 clamp(12px, 1.25vw, 17px)/1.25 "Microsoft YaHei", sans-serif;
      letter-spacing: .16em;
      text-align: center;
      white-space: nowrap;
    }

    .corner {
      position: absolute;
      z-index: 14;
      width: 30px;
      height: 30px;
      pointer-events: none;
      border-color: rgba(41, 231, 255, .62);
    }
    .corner.tl { top: 8px; left: 8px; border-top: 1px solid; border-left: 1px solid; }
    .corner.tr { top: 8px; right: 8px; border-top: 1px solid; border-right: 1px solid; }
    .corner.bl { bottom: 8px; left: 8px; border-bottom: 1px solid; border-left: 1px solid; }
    .corner.br { bottom: 8px; right: 8px; border-bottom: 1px solid; border-right: 1px solid; }

    .control-deck {
      padding-top: 2px;
    }

    .controls { display: flex; align-items: center; gap: 9px; }

    .control-btn {
      min-height: 42px;
      border: 1px solid rgba(145, 210, 244, .26);
      border-radius: 3px;
      padding: 0 15px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #dff7ff;
      background: linear-gradient(180deg, rgba(16, 32, 49, .9), rgba(5, 12, 21, .9));
      cursor: pointer;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
      font-weight: 750;
    }

    .control-btn:hover { border-color: rgba(41, 231, 255, .75); background: #102234; }
    .control-btn:active { transform: translateY(1px); }
    .control-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    .control-btn svg { width: 16px; height: 16px; fill: currentColor; }

    .timeline { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 150px; max-width: 520px; }

    .timeline-track {
      position: relative;
      flex: 1;
      height: 4px;
      overflow: hidden;
      background: #172737;
    }

    .timeline-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      background: linear-gradient(90deg, var(--red), var(--cyan));
      box-shadow: 0 0 12px var(--cyan);
    }

    .timecode {
      width: 74px;
      color: #7f98aa;
      font: 700 12px/1 ui-monospace, "Cascadia Mono", monospace;
      white-space: nowrap;
    }

    .deck-note {
      color: #60798b;
      font: 700 11px/1.3 ui-monospace, "Cascadia Mono", monospace;
      letter-spacing: .1em;
      text-align: right;
    }

    /* Scene animation */
    .star { animation: twinkle 2.8s ease-in-out infinite alternate; }
    .star:nth-of-type(2n) { animation-delay: -.8s; }
    .star:nth-of-type(3n) { animation-delay: -1.7s; }
    .city-glow { animation: cityPulse 3s ease-in-out infinite alternate; }
    .searchlight { transform-origin: bottom center; animation: search 6s ease-in-out infinite alternate; }
    .searchlight.two { animation-delay: -2.3s; animation-direction: alternate-reverse; }

    .zero-motion { transform-box: fill-box; transform-origin: center bottom; animation: zeroMotion var(--duration) linear infinite; }
    .zero-head { transform-box: fill-box; transform-origin: center bottom; animation: zeroHead var(--duration) linear infinite; }
    .zero-front-arm { transform-box: fill-box; transform-origin: 20% 15%; animation: zeroFrontArm var(--duration) linear infinite; }
    .zero-back-arm { transform-box: fill-box; transform-origin: 80% 15%; animation: zeroBackArm var(--duration) linear infinite; }
    .zero-timer { animation: timerPulse .7s ease-in-out infinite alternate; }

    .king-motion { transform-box: fill-box; transform-origin: center bottom; animation: kingMotion var(--duration) linear infinite; }
    .king-head { transform-box: fill-box; transform-origin: center bottom; animation: kingHead var(--duration) linear infinite; }
    .king-left-arm { transform-box: fill-box; transform-origin: 80% 10%; animation: kingLeftArm var(--duration) linear infinite; }
    .king-right-arm { transform-box: fill-box; transform-origin: 20% 10%; animation: kingRightArm var(--duration) linear infinite; }
    .king-eye { animation: eyePulse .55s ease-in-out infinite alternate; }

    .king-laser { stroke-dasharray: 920; stroke-dashoffset: 920; animation: kingLaser var(--duration) linear infinite; }
    .zero-beam-core { stroke-dasharray: 760; stroke-dashoffset: 760; animation: zeroBeam var(--duration) linear infinite; }
    .zero-beam-glow { stroke-dasharray: 760; stroke-dashoffset: 760; animation: zeroBeamGlow var(--duration) linear infinite; }
    .slash-arc { transform-box: fill-box; transform-origin: center; animation: slashArc var(--duration) linear infinite; }
    .impact-core { transform-box: fill-box; transform-origin: center; animation: impactCore var(--duration) linear infinite; }
    .impact-ring { transform-box: fill-box; transform-origin: center; animation: impactRing var(--duration) linear infinite; }
    .debris { transform-box: fill-box; transform-origin: center; animation: debris var(--duration) linear infinite; }
    .dust-left { transform-box: fill-box; transform-origin: center bottom; animation: dustLeft var(--duration) linear infinite; }
    .dust-right { transform-box: fill-box; transform-origin: center bottom; animation: dustRight var(--duration) linear infinite; }
    .ground-flash { animation: groundFlash var(--duration) linear infinite; }

    @keyframes livePulse { 50% { opacity: .45; transform: scale(.78); } }
    @keyframes twinkle { from { opacity: .2; } to { opacity: .9; } }
    @keyframes cityPulse { from { opacity: .35; } to { opacity: .8; } }
    @keyframes search { from { transform: rotate(-16deg); opacity: .15; } to { transform: rotate(18deg); opacity: .38; } }
    @keyframes timerPulse { to { filter: drop-shadow(0 0 14px #55f4ff); } }
    @keyframes eyePulse { to { filter: drop-shadow(0 0 10px #ff3232); opacity: .72; } }

    @keyframes introCard {
      0%, 2% { opacity: 0; transform: scale(1.08); }
      5%, 13% { opacity: 1; transform: scale(1); }
      17%, 100% { opacity: 0; transform: scale(.96); }
    }

    @keyframes sceneShake {
      0%, 31%, 36%, 55%, 59%, 76%, 80%, 100% { transform: translate(0); }
      32% { transform: translate(-3px, 1px); }
      33% { transform: translate(4px, -2px); }
      34% { transform: translate(-2px, 2px); }
      57% { transform: translate(6px, -3px); }
      58% { transform: translate(-5px, 3px); }
      78% { transform: translate(7px, 1px); }
      79% { transform: translate(-5px, -2px); }
    }

    @keyframes zeroMotion {
      0%, 8% { opacity: 0; transform: translateX(-210px); }
      14%, 25% { opacity: 1; transform: translateX(0); }
      30% { transform: translate(115px, -58px) rotate(-7deg); }
      34% { transform: translate(260px, -18px) rotate(4deg); }
      38% { transform: translate(145px, 0) rotate(0); }
      45%, 59% { transform: translate(65px, 0); }
      64% { transform: translate(35px, 5px) rotate(2deg); }
      72% { transform: translate(85px, 0); }
      77% { transform: translate(235px, -8px) rotate(-5deg); }
      82% { transform: translate(110px, 0); }
      89%, 96% { opacity: 1; transform: translate(75px, 0); }
      100% { opacity: 0; transform: translate(75px, 0); }
    }

    @keyframes zeroHead {
      0%, 25%, 42%, 100% { transform: rotate(0); }
      31% { transform: rotate(-9deg); }
      57%, 70% { transform: rotate(8deg); }
      77% { transform: rotate(-6deg); }
    }

    @keyframes zeroFrontArm {
      0%, 22% { transform: rotate(-12deg); }
      28% { transform: rotate(-75deg); }
      33% { transform: rotate(38deg); }
      39%, 49% { transform: rotate(0); }
      56%, 70% { transform: rotate(-98deg) translate(-8px, -5px); }
      74% { transform: rotate(-40deg); }
      77% { transform: rotate(46deg); }
      83%, 100% { transform: rotate(-8deg); }
    }

    @keyframes zeroBackArm {
      0%, 25% { transform: rotate(20deg); }
      33% { transform: rotate(-42deg); }
      42%, 51% { transform: rotate(9deg); }
      57%, 70% { transform: rotate(100deg) translate(15px, 5px); }
      77% { transform: rotate(-30deg); }
      83%, 100% { transform: rotate(15deg); }
    }

    @keyframes kingMotion {
      0%, 7% { opacity: 0; transform: translateY(-310px) rotate(2deg); }
      13% { opacity: 1; transform: translateY(20px) rotate(-2deg); }
      17%, 28% { transform: translateY(0); }
      33% { transform: translate(20px, -4px) rotate(5deg); }
      38%, 48% { transform: translateX(0); }
      53% { transform: translateX(-45px) rotate(-3deg); }
      59% { transform: translateX(18px) rotate(5deg); }
      64%, 73% { transform: translateX(5px); }
      78% { transform: translate(105px, -15px) rotate(10deg); }
      82% { transform: translate(58px, 0) rotate(4deg); }
      88% { transform: translate(125px, 18px) rotate(14deg); }
      96% { opacity: 1; transform: translate(145px, 34px) rotate(17deg); }
      100% { opacity: 0; transform: translate(145px, 34px) rotate(17deg); }
    }

    @keyframes kingHead {
      0%, 23%, 100% { transform: rotate(0); }
      28%, 47% { transform: rotate(-10deg); }
      56% { transform: rotate(13deg); }
      70% { transform: rotate(-4deg); }
      79%, 100% { transform: rotate(16deg); }
    }

    @keyframes kingLeftArm {
      0%, 23% { transform: rotate(-8deg); }
      27%, 44% { transform: rotate(-72deg); }
      51% { transform: rotate(10deg); }
      58% { transform: rotate(38deg); }
      70%, 100% { transform: rotate(-4deg); }
    }

    @keyframes kingRightArm {
      0%, 25% { transform: rotate(8deg); }
      32% { transform: rotate(58deg); }
      39%, 49% { transform: rotate(18deg); }
      55% { transform: rotate(-25deg); }
      70%, 100% { transform: rotate(5deg); }
    }

    @keyframes kingLaser {
      0%, 43% { opacity: 0; stroke-dashoffset: 920; }
      46% { opacity: 1; stroke-dashoffset: 0; }
      49% { opacity: .9; stroke-dashoffset: -120; }
      52%, 100% { opacity: 0; stroke-dashoffset: -920; }
    }

    @keyframes zeroBeam {
      0%, 58% { opacity: 0; stroke-dashoffset: 760; }
      61% { opacity: 1; stroke-dashoffset: 0; }
      69% { opacity: 1; stroke-dashoffset: -70; }
      72%, 100% { opacity: 0; stroke-dashoffset: -760; }
    }

    @keyframes zeroBeamGlow {
      0%, 57% { opacity: 0; stroke-dashoffset: 760; }
      60%, 70% { opacity: .7; stroke-dashoffset: 0; }
      73%, 100% { opacity: 0; stroke-dashoffset: -760; }
    }

    @keyframes slashArc {
      0%, 73% { opacity: 0; transform: rotate(-45deg) scale(.25); }
      76% { opacity: 1; transform: rotate(12deg) scale(1); }
      80% { opacity: .15; transform: rotate(38deg) scale(1.22); }
      82%, 100% { opacity: 0; transform: rotate(48deg) scale(1.28); }
    }

    @keyframes impactCore {
      0%, 31%, 55%, 75%, 100% { opacity: 0; transform: scale(.1); }
      33%, 57%, 77% { opacity: 1; transform: scale(1.2); }
      36%, 60%, 81% { opacity: 0; transform: scale(2.3); }
    }

    @keyframes impactRing {
      0%, 31%, 55%, 75%, 100% { opacity: 0; transform: scale(.2); }
      32%, 56%, 76% { opacity: 1; transform: scale(.3); }
      36%, 60%, 81% { opacity: 0; transform: scale(2.8); }
    }

    @keyframes debris {
      0%, 75% { opacity: 0; transform: translate(0) rotate(0); }
      77% { opacity: 1; transform: translate(0) rotate(0); }
      85% { opacity: 0; transform: translate(130px, -100px) rotate(210deg); }
      100% { opacity: 0; }
    }

    @keyframes dustLeft {
      0%, 10%, 28%, 100% { opacity: 0; transform: scale(.2); }
      14% { opacity: .8; transform: scale(1); }
      19% { opacity: 0; transform: translateX(-35px) scale(1.6); }
      32% { opacity: .8; transform: scale(1.2); }
      39% { opacity: 0; transform: translateX(-55px) scale(2); }
    }

    @keyframes dustRight {
      0%, 10%, 74%, 100% { opacity: 0; transform: scale(.2); }
      14% { opacity: .9; transform: scale(1.4); }
      20% { opacity: 0; transform: translateX(40px) scale(2.2); }
      78% { opacity: .9; transform: scale(1.2); }
      86% { opacity: 0; transform: translateX(80px) scale(2.3); }
    }

    @keyframes groundFlash {
      0%, 54%, 72%, 100% { opacity: 0; }
      58%, 78% { opacity: .95; }
      62%, 82% { opacity: 0; }
    }

    @keyframes zeroHealth {
      0%, 44% { transform: scaleX(1); }
      49%, 100% { transform: scaleX(.72); }
    }

    @keyframes kingHealth {
      0%, 56% { transform: scaleX(1); }
      62% { transform: scaleX(.67); }
      78%, 100% { transform: scaleX(.24); }
    }

    @keyframes cityPulse { from { opacity: .38; } to { opacity: .8; } }

    @media (max-width: 700px) {
      .page { padding: 10px; gap: 10px; }
      .eyebrow, .live-tag span, .deck-note { display: none; }
      .brand-mark { width: 30px; height: 30px; flex-basis: 30px; }
      h1 { font-size: 18px; }
      .theater { min-height: 56vh; aspect-ratio: auto; }
      .hud { grid-template-columns: 1fr 38px 1fr; gap: 8px; }
      .fighter-name { letter-spacing: .04em; }
      .fighter-id { display: none; }
      .caption { bottom: 12px; letter-spacing: .06em; }
      .control-deck { gap: 10px; }
      .control-btn { min-height: 40px; padding: 0 11px; }
      .control-btn span { display: none; }
      .timeline { gap: 8px; }
      .timecode { width: 65px; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .live-dot, .star, .city-glow, .searchlight { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">

  <script>
    (() => {
      const duration = 14000;
      const battlefield = document.getElementById('battlefield');
      const pauseButton = document.getElementById('pauseButton');
      const pauseLabel = document.getElementById('pauseLabel');
      const pauseIcon = document.getElementById('pauseIcon');
      const replayButton = document.getElementById('replayButton');
      const timelineFill = document.getElementById('timelineFill');
      const timecode = document.getElementById('timecode');
      const caption = document.getElementById('caption');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let startedAt = performance.now();
      let pausedAt = 0;
      let paused = false;

      const beats = [
        [0, '目标锁定 · 战斗开始'],
        [2100, '宇宙机器人 · 金古桥着陆'],
        [3900, '赛罗 · 极速突进'],
        [5700, '金古桥 · 佩丹尼姆激光'],
        [7600, '赛罗 · 集束光线'],
        [10100, '双重冰斧 · 终结斩击'],
        [12000, '能量反应下降 · 战斗结束']
      ];

      function format(ms) {
        return `00:${String(Math.floor(ms / 1000)).padStart(2, '0')}`;
      }

      function setPaused(next) {
        if (paused === next) return;
        paused = next;
        battlefield.classList.toggle('paused', paused);
        pauseButton.setAttribute('aria-pressed', String(paused));
        pauseButton.setAttribute('aria-label', paused ? '继续播放动画' : '暂停动画');
        pauseLabel.textContent = paused ? '播放' : '暂停';
        pauseIcon.innerHTML = paused
          ? '<path d="m8 5 11 7-11 7z"/>'
          : '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>';
        if (paused) {
          pausedAt = performance.now();
        } else {
          startedAt += performance.now() - pausedAt;
        }
      }

      function replay() {
        battlefield.classList.remove('paused');
        battlefield.style.animation = 'none';
        for (const node of battlefield.querySelectorAll('*')) node.style.animation = 'none';
        void battlefield.getBoundingClientRect();
        battlefield.style.animation = '';
        for (const node of battlefield.querySelectorAll('*')) node.style.animation = '';
        paused = false;
        pauseButton.setAttribute('aria-pressed', 'false');
        pauseButton.setAttribute('aria-label', '暂停动画');
        pauseLabel.textContent = '暂停';
        pauseIcon.innerHTML = '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>';
        startedAt = performance.now();
      }

      function update(now) {
        const elapsed = paused ? (pausedAt - startedAt) % duration : (now - startedAt) % duration;
        const progress = Math.max(0, elapsed / duration);
        timelineFill.style.width = `${progress * 100}%`;
        timecode.textContent = `${format(elapsed)} / 00:14`;
        let currentCaption = beats[0][1];
        for (const [mark, text] of beats) if (elapsed >= mark) currentCaption = text;
        if (caption.textContent !== currentCaption) caption.textContent = currentCaption;
        requestAnimationFrame(update);
      }

      pauseButton.addEventListener('click', () => setPaused(!paused));
      replayButton.addEventListener('click', replay);
      document.addEventListener('keydown', (event) => {
        if (event.code === 'Space' && event.target === document.body) {
          event.preventDefault();
          setPaused(!paused);
        }
      });

      if (reducedMotion) setPaused(true);
      requestAnimationFrame(update);
    })();
  </script>
</body>
</html>
